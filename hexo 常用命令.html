    <div class="post-body" itemprop="articleBody">
        <h5 id="Hexo-常用命令"><a href="#Hexo-常用命令" class="headerlink" title="Hexo  常用命令"></a>Hexo  常用命令</h5><figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br></pre></td><td class="code"><pre><span class="line"># 新建一篇文章（你写博客最常用！）</span><br><span class="line">hexo new &quot;文章标题&quot;</span><br><span class="line"></span><br><span class="line"># 生成静态网页（把 md 变成网页）</span><br><span class="line">hexo generate</span><br><span class="line"># 简写</span><br><span class="line">hexo g</span><br><span class="line"></span><br><span class="line"># 启动本地服务器，预览博客（localhost:4000）</span><br><span class="line">hexo server</span><br><span class="line"># 简写</span><br><span class="line">hexo s</span><br><span class="line"></span><br><span class="line"># 清理缓存（页面不更新时用）</span><br><span class="line">hexo clean</span><br></pre></td></tr></table></figure>



<h5 id="新建页面-草稿"><a href="#新建页面-草稿" class="headerlink" title="新建页面 &#x2F; 草稿"></a>新建页面 &#x2F; 草稿</h5><figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br></pre></td><td class="code"><pre><span class="line"># 新建一个页面（如 关于我、友链）</span><br><span class="line">hexo new page &quot;about&quot;</span><br><span class="line"></span><br><span class="line"># 新建草稿（不会显示在主页）</span><br><span class="line">hexo new draft &quot;草稿标题&quot;</span><br><span class="line"></span><br><span class="line"># 本地预览草稿（写稿调试用）</span><br><span class="line">hexo s --draft</span><br><span class="line"></span><br><span class="line"># 将草稿发布为正式文章</span><br><span class="line">hexo publish &quot;草稿标题&quot;</span><br></pre></td></tr></table></figure>



<h5 id="极简版"><a href="#极简版" class="headerlink" title="极简版"></a>极简版</h5><figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br></pre></td><td class="code"><pre><span class="line">hexo new &quot;标题&quot;    # 写文章</span><br><span class="line">hexo g            # 生成</span><br><span class="line">hexo s            # 预览</span><br><span class="line">hexo clean        # 清理</span><br><span class="line">hexo d -g         # 发布</span><br></pre></td></tr></table></figure>
